name: load census

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  load-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.8-beta5
      GODOT_ZIP: Godot_v4.8-beta5_linux.x86_64.zip
      SANDBOX_RELEASE: v0.60
      SANDBOX_ZIP_SHA256: 6b7f4c6a74d283352036c2cf6baf4672059ab17d4eaf00386a0357eda73ce865
    steps:
      - uses: actions/checkout@v7
      - name: Stock Godot, checked against its release's SHA512-SUMS
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION"
          curl -sSfL -O "$base/$GODOT_ZIP" -O "$base/SHA512-SUMS.txt"
          grep " $GODOT_ZIP\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$GODOT_ZIP"
          bin="${GODOT_ZIP%.zip}"
          chmod +x "$bin"
          "./$bin" --headless --version | tee version.txt
          if grep -q '\.double\.' version.txt; then echo "not the single-precision stock engine"; exit 1; fi
          echo "GODOT=$RUNNER_TEMP/$bin" >> "$GITHUB_ENV"
      - name: The godot-sandbox addon, so lasso.elf has a loader
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sandbox.zip" \
            "https://github.com/libriscv/godot-sandbox/releases/download/$SANDBOX_RELEASE/godot-sandbox.zip"
          echo "$SANDBOX_ZIP_SHA256  $RUNNER_TEMP/sandbox.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/sandbox.zip" 'addons/godot_sandbox/bin/*' -d .
      - name: lasso.elf is the single-precision guest
        run: |
          at=$(grep -obUaP 'SBXV' addons/vsk_lasso/lasso.elf | head -1 | cut -d: -f1)
          od -A n -t x1 -j "$at" -N 8 addons/vsk_lasso/lasso.elf | grep -q "53 42 58 56 18 00 00 00"
      - name: Import
        run: '"$GODOT" --headless --path . --import'
      - name: Every script, scene and resource loads without an error
        run: '"$GODOT" --headless --path . --script res://tests/load_census/load_census.gd'
      - name: Control, a planted parse error is caught and named
        run: '"$GODOT" --headless --path . --script res://tests/load_census/load_census.gd -- --control'
